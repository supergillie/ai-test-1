<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>AI Test 1</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      min-height: 100dvh;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;

      opacity: 0;
      animation: videoIn 0.7s ease forwards;
      animation-delay: 2s;
    }

    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 100vw;
      height: 56.25vw;

      min-width: 177.7778dvh;
      min-height: 100dvh;

      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }

    .title {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-family: Arial Black, Helvetica, sans-serif;
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      text-transform: lowercase;

      text-shadow:
        4px 4px 0 rgba(0,0,0,0.9),
        8px 8px 30px rgba(0,0,0,0.7);

      transform: scaleY(1.15);

      pointer-events: none;
    }

    @keyframes videoIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="video-bg">
    <iframe
      src="https://www.youtube.com/embed/MJ_s8ARJC8A?autoplay=1&mute=1&controls=0&loop=1&playlist=MJ_s8ARJC8A&playsinline=1&rel=0&modestbranding=1&disablekb=1"
      allow="autoplay; encrypted-media; picture-in-picture"
      tabindex="-1">
    </iframe>
  </div>

  <div class="title">
    klökergök
  </div>
</body>
</html>
