.video-bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;

  opacity: 0;
  animation: videoIn 0.7s ease forwards;
  animation-delay: 2s;
}

@keyframes videoIn {
  to {
    opacity: 1;
  }
}
